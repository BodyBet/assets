name: Upload assets to BodyBet Vercel Blob
description: |
  Hashes and uploads a folder of public assets from the calling repo to Vercel Blob
  under a scoped prefix, and regenerates the scoped manifest at manifests/<scope>.json.
  Requires the caller to set BLOB_READ_WRITE_TOKEN in env.

inputs:
  source:
    description: Folder in the calling repo's workspace that contains the assets (e.g. public-assets)
    required: true
  prefix:
    description: Blob pathname prefix (e.g. landing, blog, portal)
    required: true
  manifest-scope:
    description: Scope name for manifests/<scope>.json (typically matches prefix)
    required: true

runs:
  using: composite
  steps:
    - name: Checkout bodybet-assets
      uses: actions/checkout@v4
      with:
        repository: bodybet/bodybet-assets
        ref: main
        path: .bodybet-assets

    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install bodybet-assets deps
      shell: bash
      working-directory: .bodybet-assets
      run: npm ci --omit=dev

    - name: Run upload script
      shell: bash
      run: |
        node .bodybet-assets/scripts/upload-assets-to-blob.mjs \
          --source "${{ github.workspace }}/${{ inputs.source }}" \
          --prefix "${{ inputs.prefix }}" \
          --manifest-scope "${{ inputs.manifest-scope }}"
